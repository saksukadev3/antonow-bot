<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RXC STORE</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #ffffff; color: #000; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #ddd; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #0083b0; color: white; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        .role-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; color: #fff; font-size: 12px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="auth-card" class="card">
        <h2 id="title">GİRİŞ YAP</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button id="main-btn" onclick="authAction()">GİRİŞ YAP</button>
        <div style="margin-top:20px;">
            <p style="font-size:12px;">Google ile giriş:</p>
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="width:30px; cursor:pointer;" onclick="googleLogin()">
        </div>
    </div>

    <!-- ÜYE MAĞAZA -->
    <div id="user-card" class="card hidden">
        <h2>RXC MAĞAZA</h2>
        <div class="role-badge" style="background:#d32f2f">ÜYE</div>
        <button style="background:#d32f2f" onclick="firebase.auth().signOut()">ÇIKIŞ YAP</button>
    </div>

    <!-- YÖNETİCİ PANELİ -->
    <div id="admin-card" class="card hidden">
        <h2>👑 YÖNETİCİ PANELİ</h2>
        <div class="role-badge" style="background:#00bcd4">YÖNETİCİ</div>
        <button style="background:#2e7d32" onclick="alert('Admin özellikleri aktif')">APK YÖNETİMİ</button>
        <button style="background:#d32f2f" onclick="firebase.auth().signOut()">ÇIKIŞ YAP</button>
    </div>

    <script>
        const config = { apiKey: "AIzaSyDw09ubEEogXBCR0P_zi8bXRW7I9kItEIU", authDomain: "antonow-bot.firebaseapp.com", projectId: "antonow-bot", storageBucket: "antonow-bot.firebasestorage.app", messagingSenderId: "883455416719", appId: "1:883455416719:web:57a4a65e4c32b99e3393fa" };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        function authAction() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            firebase.auth().signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function googleLogin() { firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        firebase.auth().onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-card').classList.add('hidden');
                // ROL KONTROLÜ: Admin maili mi veya Firestore'da yönetici mi?
                db.collection("kullanicilar").doc(user.uid).get().then(doc => {
                    const data = doc.data();
                    if (user.email === "ruslanantonovow6837@rambler.ru" || (data && data.rol === "YÖNETİCİ")) {
                        document.getElementById('admin-card').classList.remove('hidden');
                    } else {
                        document.getElementById('user-card').classList.remove('hidden');
                    }
                });
            } else {
                document.getElementById('auth-card').classList.remove('hidden');
                document.getElementById('user-card').classList.add('hidden');
                document.getElementById('admin-card').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
