<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RXC STORE</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #ffffff; color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #f9f9f9; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #dddddd; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #bbbbbb; background: #ffffff; color: #000000; font-size: 15px; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0083b0; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none !important; }
        .profile-top { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; border-radius: 6px; border: 2px solid #00b4db; object-fit: cover; }
        .role-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #ffffff; margin-bottom: 10px; }
        .role-uye { background: #d32f2f; }
        .role-yonetici { background: #00bcd4; }
        .user-list { text-align: left; max-height: 150px; overflow-y: auto; background: #eeeeee; padding: 10px; border-radius: 6px; font-size: 12px; margin: 10px 0; }
        .user-item { border-bottom: 1px solid #aaaaaa; padding: 5px 0; display: flex; justify-content: space-between; align-items: center; }
        .apk-box { border: 1px solid #bbbbbb; background: #ffffff; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: left; }
    </style>
</head>
<body>

    <!-- Yüklenme ekranı -->
    <div id="loading-card" class="card">
        <h2>RXC STORE</h2>
        <p>Yükleniyor...</p>
    </div>

    <!-- Giriş / Kayıt -->
    <div id="auth-card" class="card hidden">
        <h2>KAYIT OL / GİRİŞ</h2>
        <input type="text" id="reg-username" placeholder="Kullanıcı adı">
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button id="auth-btn" onclick="kayitOlAction()">KAYIT OL</button>
        <button style="background:#555;" onclick="geisYapModunaGec()">Giriş Yap'a Geç</button>
        <div id="error-msg" style="color:red; margin-top:10px;"></div>
    </div>

    <!-- Üye Paneli -->
    <div id="user-card" class="card hidden">
        <img id="user-profile-img" class="profile-top" src="" alt="P">
        <h2>RXC MAĞAZA</h2>
        <div id="user-role-badge" class="role-badge role-uye">ÜYE</div>
        <p>Hoş geldin, <span id="user-username"></span>!</p>
        <div id="apk-list-area"></div>
        <button onclick="cikisYap()">ÇIKIŞ YAP</button>
    </div>

    <!-- Admin Paneli -->
    <div id="admin-card" class="card hidden">
        <h2>👑 YÖNETİCİ PANELİ</h2>
        <button onclick="toggleUserList()">Üyeleri Yönet</button>
        <div id="user-list-box" class="user-list hidden"></div>
        <div class="apk-box">
            <input type="text" id="apk-ad" placeholder="Uygulama Adı">
            <input type="text" id="apk-link" placeholder="Link">
            <input type="text" id="apk-surum" placeholder="Sürüm">
            <button onclick="apkEkle()">APK YÜKLE</button>
        </div>
        <button onclick="cikisYap()">ÇIKIŞ YAP</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDw09ubEEogXBCR0P_zi8bXRW7I9kItEIU",
            authDomain: "antonow-bot.firebaseapp.com",
            projectId: "antonow-bot",
            storageBucket: "antonow-bot.firebasestorage.app",
            messagingSenderId: "883455416719",
            appId: "1:883455416719:web:57a4a65e4c32b99e3393fa",
            measurementId: "G-1TS5GEWDX4"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let isLoginMode = false;

        // GÜVENLİK: Yüklenme ekranında kalmayı engellemek için 3 saniye sonra zorla gizle
        setTimeout(() => { document.getElementById('loading-card').classList.add('hidden'); }, 3000);

        firebase.auth().onAuthStateChanged((user) => {
            document.getElementById('loading-card').classList.add('hidden');
            if(user) {
                document.getElementById('auth-card').classList.add('hidden');
                db.collection("kullanicilar").doc(user.uid).get().then((doc) => {
                    let u = doc.data() || {rol: 'ÜYE', username: 'User'};
                    if(user.email === "ruslanantonovow6837@rambler.ru" || u.rol === "YÖNETİCİ") {
                        document.getElementById('admin-card').classList.remove('hidden');
                        yukleKullaniciListesi();
                    } else {
                        document.getElementById('user-card').classList.remove('hidden');
                        document.getElementById('user-username').innerText = u.username;
                    }
                    apkListesiniGuncelle();
                });
            } else {
                document.getElementById('auth-card').classList.remove('hidden');
            }
        });

        function geisYapModunaGec() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').innerText = isLoginMode ? "GİRİŞ YAP" : "KAYIT OL";
        }

        function kayitOlAction() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value, u = document.getElementById('reg-username').value;
            if(isLoginMode) {
                firebase.auth().signInWithEmailAndPassword(e, p).catch(err => document.getElementById('error-msg').innerText = err.message);
            } else {
                firebase.auth().createUserWithEmailAndPassword(e, p).then(cred => {
                    db.collection("kullanicilar").doc(cred.user.uid).set({username: u, email: e, rol: (e === "ruslanantonovow6837@rambler.ru" ? "YÖNETİCİ" : "ÜYE")});
                }).catch(err => document.getElementById('error-msg').innerText = err.message);
            }
        }

        function cikisYap() { firebase.auth().signOut(); location.reload(); }

        function yukleKullaniciListesi() {
            const box = document.getElementById('user-list-box');
            box.classList.remove('hidden');
            db.collection("kullanicilar").get().then(snap => {
                box.innerHTML = "";
                snap.forEach(d => {
                    let u = d.data();
                    box.innerHTML += `<div class="user-item"><b>${u.username}</b> - ${u.rol}</div>`;
                });
            });
        }

        function apkEkle() {
            db.collection("apklar").add({ad: document.getElementById('apk-ad').value, link: document.getElementById('apk-link').value}).then(() => alert("Eklendi!"));
        }

        function apkListesiniGuncelle() {
            const area = document.getElementById('apk-list-area');
            db.collection("apklar").get().then(snap => {
                area.innerHTML = "";
                snap.forEach(d => {
                    let apk = d.data();
                    area.innerHTML += `<div class="apk-box">${apk.ad} <a href="${apk.link}">İNDİR</a></div>`;
                });
            });
        }
    </script>
</body>
</html>
